<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>BearMetal Dev Proxy</title>
		<style>
		body {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			font-family: Arial, sans-serif;
			background-color: #2b0f3f;
			color: white;
			font-size: 2em;
			text-align: center;

			& > div {
				max-width: 54rem;
				padding: 2rem;
				border-radius: 3rem;
				corner-shape: squircle;
				/* background: rgb(255, 255, 255, 0.1); */
				box-shadow:
					12px 12px 24px #220c32,
					-12px -12px 24px #34124c;
			}
		}
		</style>
	</head>
	<body>
		<div>
			<h1>No known development server for this host</h1>
			<p>
				Please ensure the development server is running and accessible
				and that it is properly configured to use the BearMetal Dev
				Proxy module.
			</p>
		</div>
	</body>
</html>
