<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <script type="module" src="./counter.ts"></script>

        <style>
            body {
                margin: 0;
                display: grid;
                place-items: center;
                width: 100vw;
                height: 100vh;
            }
            sample-counter {
                place-self: center;
                text-align: center;
                & div {
                    align-items: center;
                    display: grid;
                    gap: 0.5rem;
                    grid-template-columns: 1fr 1fr auto 1fr 1fr;
                    width: max-content;
                    margin: 0 auto;
                }
            }

            h1 {
                font-size: 3.5rem;
                margin-bottom: 0;
            }

            button {
                padding: 0.25rem 0.5rem;
                border: none;
                border-radius: 0.5rem;
                background-color: green;
                color: white;
                font-size: 1rem;
                cursor: pointer;
                font-weight: bold;
                &.down {
                    background-color: red;
                }
            }

            :root {
                font-size: 24px;
                font-family:
                    "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS",
                    sans-serif;
            }

            span {
                font-size: 3rem;
            }
        </style>
    </head>
    <body>
        <sample-counter></sample-counter>
    </body>
</html>
