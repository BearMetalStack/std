<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>BearPost</title>
		<script type="module" src="./main.tsx"></script>
		<style>
			*, *::before, *::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--bg: #000000;
				--bg-raised: #0f1117;
				--bg-card: #16181c;
				--bg-hover: #1c1f26;
				--border: #2f3336;
				--text: #e7e9ea;
				--text-muted: #71767b;
				--text-dim: #536471;
				--blue: #1d9bf0;
				--blue-hover: #1a8cd8;
				--blue-bg: rgba(29, 155, 240, 0.10);
				--green: #00ba7c;
				--green-bg: rgba(0, 186, 124, 0.10);
				--red: #f91880;
				--red-bg: rgba(249, 24, 128, 0.10);
				--yellow: #ffd400;
				--radius-sm: 6px;
				--radius-md: 12px;
				--radius-pill: 9999px;
				--sidebar-w: 270px;
				--right-w: 350px;
				--main-max: 600px;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
				font-size: 15px;
				line-height: 1.5;
				color: var(--text);
				background: var(--bg);
			}

			/* ─── Layout ─────────────────────────────────── */

			twitter-app {
				display: contents;
			}

			.app-layout {
				display: grid;
				grid-template-columns: var(--sidebar-w) minmax(0, var(--main-max)) var(--right-w);
				min-height: 100vh;
				max-width: calc(var(--sidebar-w) + var(--main-max) + var(--right-w));
				margin: 0 auto;
			}

			/* ─── Sidebar ─────────────────────────────────── */

			twitter-sidebar {
				display: contents;
			}

			.sidebar {
				position: sticky;
				top: 0;
				height: 100vh;
				display: flex;
				flex-direction: column;
				padding: 0 12px;
				border-right: 1px solid var(--border);
				overflow-y: auto;
			}

			.sidebar-brand {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 16px 12px;
				font-size: 22px;
				font-weight: 800;
				letter-spacing: -0.5px;
				color: var(--text);
			}
			.brand-bear {
				font-size: 28px;
			}

			.sidebar-nav {
				display: flex;
				flex-direction: column;
				gap: 2px;
				flex: 1;
				padding: 8px 0;
			}

			.nav-item {
				display: flex;
				align-items: center;
				gap: 18px;
				padding: 12px;
				border-radius: var(--radius-pill);
				background: none;
				border: none;
				color: var(--text);
				cursor: pointer;
				font-size: 17px;
				font-weight: 500;
				width: 100%;
				text-align: left;
				transition: background 0.15s;
				position: relative;
			}
			.nav-item:hover {
				background: var(--bg-hover);
			}
			.nav-item--active {
				font-weight: 700;
			}
			.nav-item--active .nav-icon {
				color: var(--blue);
			}

			.nav-icon {
				font-size: 22px;
				width: 26px;
				text-align: center;
				line-height: 1;
			}

			.notif-badge {
				position: absolute;
				top: 6px;
				left: 30px;
				background: var(--blue);
				color: #fff;
				font-size: 11px;
				font-weight: 700;
				padding: 1px 5px;
				border-radius: var(--radius-pill);
				min-width: 18px;
				text-align: center;
			}

			.compose-btn {
				background: var(--blue);
				color: #fff;
				border: none;
				border-radius: var(--radius-pill);
				padding: 14px 24px;
				font-size: 16px;
				font-weight: 700;
				cursor: pointer;
				width: 100%;
				margin: 16px 0;
				transition: background 0.15s;
			}
			.compose-btn:hover {
				background: var(--blue-hover);
			}

			.sidebar-profile {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 10px 12px;
				border-radius: var(--radius-pill);
				background: none;
				border: none;
				color: var(--text);
				cursor: pointer;
				width: 100%;
				margin-top: auto;
				margin-bottom: 8px;
				transition: background 0.15s;
			}
			.sidebar-profile:hover {
				background: var(--bg-hover);
			}

			.sidebar-profile-info {
				display: flex;
				flex-direction: column;
				text-align: left;
				flex: 1;
				min-width: 0;
			}

			.profile-name {
				font-weight: 700;
				font-size: 14px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.profile-handle {
				color: var(--text-muted);
				font-size: 13px;
			}

			.profile-more {
				color: var(--text-muted);
				font-size: 18px;
				letter-spacing: 1px;
			}

			/* ─── Avatar ─────────────────────────────────── */

			.avatar {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				border-radius: 50%;
				background: var(--avatar-color, var(--blue));
				color: #fff;
				font-weight: 700;
				flex-shrink: 0;
				user-select: none;
			}
			.avatar--sm {
				width: 32px;
				height: 32px;
				font-size: 13px;
			}
			.avatar--md {
				width: 40px;
				height: 40px;
				font-size: 16px;
			}
			.avatar--lg {
				width: 48px;
				height: 48px;
				font-size: 19px;
			}
			.avatar--xl {
				width: 72px;
				height: 72px;
				font-size: 28px;
				border: 4px solid var(--bg);
			}

			/* ─── Main content ─────────────────────────────── */

			.main-content {
				border-right: 1px solid var(--border);
				min-height: 100vh;
			}

			.page-header {
				position: sticky;
				top: 0;
				background: rgba(0, 0, 0, 0.85);
				backdrop-filter: blur(12px);
				border-bottom: 1px solid var(--border);
				padding: 14px 16px;
				z-index: 10;
			}

			.page-title {
				font-size: 18px;
				font-weight: 800;
				letter-spacing: -0.3px;
			}

			.back-btn {
				background: none;
				border: none;
				color: var(--text);
				cursor: pointer;
				font-size: 15px;
				font-weight: 500;
				padding: 4px 8px;
				border-radius: var(--radius-sm);
				transition: background 0.15s;
			}
			.back-btn:hover {
				background: var(--bg-hover);
			}

			/* ─── Composer ─────────────────────────────────── */

			twitter-composer {
				display: block;
			}

			.home-composer-wrap {
				padding: 12px 16px;
				border-bottom: 1px solid var(--border);
			}

			.composer {
				display: flex;
				gap: 12px;
				align-items: flex-start;
			}

			.composer-right {
				flex: 1;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.composer-textarea {
				width: 100%;
				min-height: 80px;
				background: transparent;
				border: none;
				color: var(--text);
				font-size: 18px;
				resize: none;
				outline: none;
				font-family: inherit;
				line-height: 1.5;
			}

			.composer-textarea::placeholder {
				color: var(--text-dim);
			}

			.composer-footer {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 12px;
				padding-top: 8px;
				border-top: 1px solid var(--border);
			}

			.char-count {
				font-size: 13px;
				color: var(--text-muted);
			}
			.char-count--over {
				color: var(--red);
			}
			.composer-limit {
				color: var(--text-dim);
			}

			.post-btn {
				background: var(--blue);
				color: #fff;
				border: none;
				border-radius: var(--radius-pill);
				padding: 8px 18px;
				font-size: 14px;
				font-weight: 700;
				cursor: pointer;
				transition: background 0.15s;
			}
			.post-btn:hover:not(:disabled) {
				background: var(--blue-hover);
			}
			.post-btn:disabled {
				opacity: 0.5;
				cursor: default;
			}

			.feed-divider {
				border-bottom: 1px solid var(--border);
			}

			/* ─── Tweet card ─────────────────────────────────── */

			.tweet {
				display: flex;
				gap: 12px;
				padding: 14px 16px;
				border-bottom: 1px solid var(--border);
				transition: background 0.1s;
				cursor: default;
			}
			.tweet:hover {
				background: rgba(255, 255, 255, 0.03);
			}

			.tweet-avatar-btn {
				background: none;
				border: none;
				padding: 0;
				cursor: pointer;
				flex-shrink: 0;
			}

			.tweet-body {
				flex: 1;
				min-width: 0;
			}

			.tweet-meta {
				display: flex;
				align-items: baseline;
				gap: 6px;
				flex-wrap: wrap;
				margin-bottom: 2px;
			}

			.tweet-author-btn {
				background: none;
				border: none;
				padding: 0;
				cursor: pointer;
				display: flex;
				gap: 6px;
				align-items: baseline;
			}
			.tweet-author-btn:hover .tweet-name {
				text-decoration: underline;
			}

			.tweet-name {
				font-weight: 700;
				color: var(--text);
				font-size: 15px;
			}

			.tweet-handle, .tweet-time {
				color: var(--text-muted);
				font-size: 14px;
			}

			.tweet-dot {
				color: var(--text-dim);
			}

			.tweet-text {
				font-size: 15px;
				line-height: 1.6;
				color: var(--text);
				margin: 4px 0 10px;
				word-break: break-word;
			}

			.tweet-actions {
				display: flex;
				gap: 24px;
				margin-top: 4px;
			}

			.action {
				display: flex;
				align-items: center;
				gap: 6px;
				background: none;
				border: none;
				color: var(--text-muted);
				cursor: pointer;
				font-size: 13px;
				padding: 4px;
				border-radius: var(--radius-pill);
				transition: color 0.15s;
			}
			.action:hover {
				color: var(--text);
			}

			.action-icon {
				display: flex;
				align-items: center;
			}
			.action-label {
				min-width: 20px;
			}

			.action--like:hover,
			.action--like.action--on {
				color: var(--red);
			}
			.action--like:hover .action-icon svg,
			.action--like.action--on .action-icon svg {
				stroke: var(--red);
			}

			.action--retweet:hover,
			.action--retweet.action--on {
				color: var(--green);
			}
			.action--retweet:hover .action-icon svg,
			.action--retweet.action--on .action-icon svg {
				stroke: var(--green);
			}

			.action--share:hover {
				color: var(--blue);
			}

			/* ─── Mini tweet (explore) ─────────────────────────── */

			.mini-tweet {
				display: flex;
				gap: 10px;
				padding: 10px 16px;
				border-bottom: 1px solid var(--border);
				transition: background 0.1s;
			}
			.mini-tweet:hover {
				background: rgba(255, 255, 255, 0.03);
			}

			.mini-tweet-body {
				flex: 1;
				min-width: 0;
			}

			.mini-tweet-meta {
				display: flex;
				gap: 6px;
				align-items: baseline;
				flex-wrap: wrap;
				margin-bottom: 2px;
			}

			.mini-tweet-actions {
				display: flex;
				gap: 16px;
				margin-top: 6px;
			}

			/* ─── Explore ─────────────────────────────────── */

			twitter-explore {
				display: block;
			}

			.explore-search-wrap {
				padding: 12px 16px;
				border-bottom: 1px solid var(--border);
			}

			.explore-search {
				width: 100%;
				background: var(--bg-card);
				border: 1px solid transparent;
				color: var(--text);
				border-radius: var(--radius-pill);
				padding: 10px 16px;
				font-size: 15px;
				outline: none;
				transition: border-color 0.15s;
			}
			.explore-search:focus {
				border-color: var(--blue);
			}

			.explore-section {
				padding: 0;
			}

			.section-title {
				font-size: 18px;
				font-weight: 800;
				padding: 16px 16px 8px;
			}

			.trending-list {
				display: flex;
				flex-direction: column;
			}

			.trending-item {
				display: flex;
				flex-direction: column;
				gap: 2px;
				padding: 12px 16px;
				background: none;
				border: none;
				border-bottom: 1px solid var(--border);
				color: var(--text);
				cursor: pointer;
				text-align: left;
				transition: background 0.1s;
			}
			.trending-item:hover {
				background: var(--bg-hover);
			}

			.trending-topic {
				font-weight: 700;
				font-size: 15px;
			}
			.trending-posts {
				font-size: 13px;
				color: var(--text-muted);
			}

			/* ─── Profile ─────────────────────────────────── */

			twitter-profile {
				display: block;
			}

			.profile-cover {
				height: 140px;
				background: linear-gradient(135deg, var(--cover-color, var(--blue)) 0%, transparent 100%);
				opacity: 0.5;
			}

			.profile-info-row {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				padding: 12px 16px 0;
				margin-top: -36px;
			}

			.profile-details {
				padding: 12px 16px 0;
			}

			.profile-display-name {
				font-size: 20px;
				font-weight: 800;
				letter-spacing: -0.3px;
			}

			.profile-bio {
				margin: 8px 0;
				color: var(--text);
				font-size: 15px;
				line-height: 1.5;
			}

			.profile-meta {
				display: flex;
				gap: 16px;
				flex-wrap: wrap;
				color: var(--text-muted);
				font-size: 14px;
				margin: 6px 0;
			}

			.meta-item {
				display: flex;
				align-items: center;
				gap: 4px;
			}

			.profile-counts {
				display: flex;
				gap: 20px;
				margin: 8px 0 4px;
				font-size: 14px;
			}

			.count-item {
				color: var(--text-muted);
			}
			.count-item strong {
				color: var(--text);
			}

			.profile-tabs {
				display: flex;
				border-bottom: 1px solid var(--border);
				margin-top: 8px;
			}

			.tab-btn {
				flex: 1;
				padding: 16px;
				background: none;
				border: none;
				border-bottom: 2px solid transparent;
				color: var(--text-muted);
				cursor: pointer;
				font-size: 15px;
				font-weight: 500;
				transition: color 0.15s;
			}
			.tab-btn:hover {
				color: var(--text);
				background: var(--bg-hover);
			}
			.tab-btn--active {
				color: var(--text);
				font-weight: 700;
				border-bottom-color: var(--blue);
			}

			.btn-outline {
				border: 1px solid var(--border);
				background: none;
				color: var(--text);
				border-radius: var(--radius-pill);
				padding: 8px 18px;
				font-size: 14px;
				font-weight: 700;
				cursor: pointer;
				transition: background 0.15s;
				margin-top: 36px;
			}
			.btn-outline:hover {
				background: var(--bg-hover);
			}

			.btn-follow {
				border: none;
				background: var(--text);
				color: var(--bg);
				border-radius: var(--radius-pill);
				padding: 8px 18px;
				font-size: 14px;
				font-weight: 700;
				cursor: pointer;
				transition: opacity 0.15s;
				margin-top: 36px;
			}
			.btn-follow--sm {
				margin-top: 0;
				padding: 6px 14px;
				font-size: 13px;
			}
			.btn-follow:hover {
				opacity: 0.85;
			}
			.btn-follow--active {
				background: none;
				border: 1px solid var(--border);
				color: var(--text);
			}
			.btn-follow--active:hover {
				border-color: var(--red);
				color: var(--red);
				background: var(--red-bg);
			}

			.empty-state {
				padding: 40px 16px;
				text-align: center;
				color: var(--text-muted);
				font-size: 15px;
			}

			/* ─── Notifications ─────────────────────────────── */

			twitter-notifications {
				display: block;
			}

			.notif-tabs {
				display: flex;
				border-bottom: 1px solid var(--border);
			}

			.notif-list {}

			.notif-card {
				display: flex;
				gap: 14px;
				padding: 14px 16px;
				border-bottom: 1px solid var(--border);
				transition: background 0.1s;
				cursor: pointer;
			}
			.notif-card:hover {
				background: var(--bg-hover);
			}
			.notif-card--unread {
				background: rgba(29, 155, 240, 0.04);
			}

			.notif-type-icon {
				font-size: 20px;
				width: 32px;
				text-align: center;
				flex-shrink: 0;
			}

			.notif-type--like {
				color: var(--red);
			}
			.notif-type--retweet {
				color: var(--green);
			}
			.notif-type--follow {
				color: var(--blue);
			}
			.notif-type--reply {
				color: var(--blue);
			}
			.notif-type--mention {
				color: var(--yellow);
			}

			.notif-body {
				flex: 1;
				min-width: 0;
			}

			.notif-from {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
				font-size: 14px;
			}

			.notif-user-btn {
				background: none;
				border: none;
				color: var(--text);
				cursor: pointer;
				font-size: 14px;
				padding: 0;
			}
			.notif-user-btn:hover strong {
				text-decoration: underline;
			}

			.notif-action {
				color: var(--text-muted);
			}
			.notif-time {
				color: var(--text-dim);
				margin-left: auto;
			}

			.notif-tweet-text {
				margin-top: 4px;
				color: var(--text-muted);
				font-size: 14px;
				line-height: 1.4;
			}

			/* ─── Right panel ─────────────────────────────── */

			twitter-right-panel {
				display: contents;
			}

			.right-panel {
				position: sticky;
				top: 0;
				height: 100vh;
				padding: 8px 16px;
				display: flex;
				flex-direction: column;
				gap: 16px;
				overflow-y: auto;
			}

			.right-search-wrap {
				padding-top: 4px;
			}

			.right-search {
				display: flex;
				align-items: center;
				gap: 10px;
				background: var(--bg-card);
				border: 1px solid transparent;
				border-radius: var(--radius-pill);
				padding: 10px 16px;
				transition: border-color 0.15s;
			}
			.right-search:focus-within {
				border-color: var(--blue);
				background: var(--bg);
			}

			.search-icon {
				color: var(--text-muted);
				flex-shrink: 0;
			}

			.right-search-input {
				background: none;
				border: none;
				color: var(--text);
				font-size: 15px;
				outline: none;
				width: 100%;
			}
			.right-search-input::placeholder {
				color: var(--text-muted);
			}

			.panel-card {
				background: var(--bg-card);
				border-radius: var(--radius-md);
				overflow: hidden;
			}

			.panel-title {
				padding: 14px 16px 10px;
				font-size: 18px;
				font-weight: 800;
			}

			.trending-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 10px 16px;
				font-size: 14px;
				border-top: 1px solid var(--border);
			}
			.trending-row .trending-topic {
				font-weight: 600;
			}
			.trending-count {
				color: var(--text-muted);
				font-size: 12px;
			}

			.suggest-list {
				display: flex;
				flex-direction: column;
			}

			.suggest-item {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				padding: 10px 16px;
				border-top: 1px solid var(--border);
			}

			.suggest-profile-btn {
				display: flex;
				align-items: center;
				gap: 10px;
				background: none;
				border: none;
				cursor: pointer;
				color: var(--text);
				min-width: 0;
				flex: 1;
			}

			.suggest-info {
				display: flex;
				flex-direction: column;
				text-align: left;
				min-width: 0;
			}

			.suggest-name {
				font-weight: 700;
				font-size: 14px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.panel-footer {
				font-size: 13px;
				color: var(--text-dim);
				text-align: center;
				padding: 8px;
				margin-top: auto;
			}

			/* ─── Modal ─────────────────────────────────── */

			twitter-modal {
				display: flex;
				position: fixed;
				inset: 0;
				z-index: 100;
			}

			.modal-backdrop {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.6);
				display: flex;
				align-items: flex-start;
				justify-content: center;
				padding-top: 60px;
			}

			.modal-inner {
				width: 100%;
				max-width: 600px;
			}

			.modal-composer {
				background: var(--bg);
				border-radius: var(--radius-md);
				padding: 16px;
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
			}

			.modal-header {
				display: flex;
				justify-content: flex-end;
				margin-bottom: 12px;
			}

			.modal-close {
				background: none;
				border: none;
				color: var(--text);
				cursor: pointer;
				font-size: 18px;
				padding: 4px 8px;
				border-radius: 50%;
				transition: background 0.15s;
				line-height: 1;
			}
			.modal-close:hover {
				background: var(--bg-hover);
			}

			/* ─── Scrollbar ───────────────────────────────── */

			::-webkit-scrollbar {
				width: 4px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
			::-webkit-scrollbar-thumb {
				background: var(--border);
				border-radius: 2px;
			}
		</style>
	</head>
	<body>
		<twitter-app></twitter-app>
	</body>
</html>
